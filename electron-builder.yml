appId: ai.vibeusage.desktop
productName: Vibe Usage Desktop
directories:
  output: dist
files:
  - main.js
  - preload.js
  - server/**/*
  - cli/**/*
  - build/icon.png
  - package.json
# The CLI is spawned as a plain Node script (ELECTRON_RUN_AS_NODE) — scripts
# inside app.asar cannot be executed that way, so unpack cli/ to disk.
asarUnpack:
  - cli/**/*
icon: build/icon.png
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Utility
